<script>
  const toggle = document.getElementById('menu-toggle');
  const closeBtn = document.getElementById('menu-close');
  const nav = document.getElementById('main-nav');
 
  if (toggle && closeBtn && nav) {
    toggle.addEventListener('click', () => nav.classList.remove('hidden'));
    closeBtn.addEventListener('click', () => nav.classList.add('hidden'));
  }
 
  const toggles = document.querySelectorAll(".dropdown-toggle");
  const contents = document.querySelectorAll(".dropdown-content");
  toggles.forEach((toggle, index) => {
    toggle.addEventListener("click", () => {
      const content = contents[index];
      const isOpen = content.classList.contains("open");
      contents.forEach(c => c.classList.remove("open"));
      toggles.forEach(t => t.classList.remove("active"));
      if (!isOpen) {
        content.classList.add("open");
        toggle.classList.add("active");
      }
    });
  });
 
  const allVideos = document.querySelectorAll('.video-wrapper video');

  allVideos.forEach(video => {
    video.addEventListener('play', () => {
      allVideos.forEach(other => {
        if (other !== video) {
          other.pause();
          other.parentElement.classList.remove('playing');
        }
      });
      video.parentElement.classList.add('playing');
    });
    video.addEventListener('pause', () => video.parentElement.classList.remove('playing'));
    video.addEventListener('ended', () => video.parentElement.classList.remove('playing'));
  });
 
  window.addEventListener('scroll', () => {
    const header = document.querySelector('header');
    if (header) {
      header.classList.toggle('scrolled', window.scrollY > 50);
    }
  });
 
  // --- Intro reveal and headline ---
  const phrases = [
    "Conor O'Carroll.",
    "Editor x Designer.",
    "Founder of GazeProfit.",
    "30M+ views.",
    "4x thumbnail performance."
  ];
  const typewriter = document.getElementById("typewriter");
  let phraseIndex = 0;
  let charIndex = 0;
  let isDeleting = false;
  let hasRevealed = false;

  const typeSpeed = 70;
  const deleteSpeed = 35;
  const pauseAfterType = 1800;
  const pauseAfterDelete = 350;
 
  function revealPage() {
    if (hasRevealed) return;
    hasRevealed = true;
    document.querySelectorAll('.hidden-until-reveal').forEach((el, i) => {
      setTimeout(() => el.classList.add('revealed'), i * 120);
    });
  }

  function type() {
    const phrase = phrases[phraseIndex];
    typewriter.textContent = phrase.substring(0, isDeleting ? charIndex - 1 : charIndex + 1);

    charIndex += isDeleting ? -1 : 1;

    if (!isDeleting && charIndex === phrase.length) {
      isDeleting = true;
      setTimeout(type, pauseAfterType);
      return;
    }

    if (isDeleting && charIndex === 0) {
      isDeleting = false;
      phraseIndex = (phraseIndex + 1) % phrases.length;
      setTimeout(type, pauseAfterDelete);
      return;
    }

    setTimeout(type, isDeleting ? deleteSpeed : typeSpeed);
  }

  revealPage();
  type();
</script>
